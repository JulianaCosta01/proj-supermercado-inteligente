# pg_hba do piloto. Montado no contêiner do banco (ver compose.yaml).
# O socket Unix é compartilhado com API e worker: sem esta configuração (trust local, padrão
# da imagem oficial), quem monta o socket entra como superusuário e ignora todos os papéis.
# TYPE  DATABASE  USER                                  ADDRESS  METHOD
local   all       postgres                                       peer
local   stp       stp_app_u,stp_worker_u,stp_migrador_u          scram-sha-256
local   all       all                                            reject
host    all       all                                   all      reject
